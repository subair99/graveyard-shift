# Nightly re-verification (task 13.8 of the resurrection-pipeline spec; design "Workflow YAML", nightly.yml).
#
# - No write permission anywhere: workflow-level `permissions: {}`, job `verify` holds `contents: read` and `attestations: read` only (`gh attestation verify` needs the latter).
# - The token reaches the script through `env:` on the step, never inside a `run:` string.
# - Node is pinned to 26.13.1 (PINNED_NODE_VERSION); a `node --version` step fails the job on a difference.
# - The optional notify job (task 13.9) is not part of this file.

name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
      - name: Check Node version
        run: '[ "$(node --version)" = "v26.13.1" ] || { echo "unexpected Node version: $(node --version)"; exit 1; }'
      - run: npm ci
      - name: Re-verify graveyard
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx tsx scripts/ci/nightly.ts
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-report
          path: nightly-report.json
          if-no-files-found: warn
          retention-days: 7
